name: Obsidian advisory review

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write advisory reports and job summary
        run: pnpm review
      - name: Report checker startup failure
        if: failure()
        run: echo 'The advisory checker could not start. This does not block releases or merges.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-advisory-review
          path: reports/
          if-no-files-found: ignore
